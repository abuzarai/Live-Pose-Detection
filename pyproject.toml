[project]
name = "live-pose-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["live_pose_detection*"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
]
